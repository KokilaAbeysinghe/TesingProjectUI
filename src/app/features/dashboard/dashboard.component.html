<app-page-header
  title="Dashboard"
  subtitle="Welcome to your hardware shop POS system"
/>

<div class="welcome-panel">
  <h2>Hello, {{ userEmail }}</h2>
  <p>You are signed in as <strong>{{ userRole }}</strong>.</p>
  <p class="welcome-note">Use the sidebar menu to navigate. More features like Products and Sales will be added next.</p>
</div>

<div class="stats-grid">
  <div class="stat-card">
    <span class="stat-label">Products</span>
    <span class="stat-value">Coming soon</span>
    <span class="stat-sub">Manage inventory</span>
  </div>
  <div class="stat-card">
    <span class="stat-label">Sales</span>
    <span class="stat-value">Coming soon</span>
    <span class="stat-sub">Process transactions</span>
  </div>
  <a class="stat-card" routerLink="/app/customers">
    <span class="stat-label">Customers</span>
    <span class="stat-value">{{ customerCount() ?? '—' }}</span>
    <span class="stat-sub">Customer records</span>
  </a>
</div>
